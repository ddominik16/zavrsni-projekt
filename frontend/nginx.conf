server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aplikacija je jedna stranica, pa sve nepoznate putanje vracaju index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
