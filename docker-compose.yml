# Cijeli projekt u tri kontejnera: baza, backend, frontend.
#
#   docker compose up --build
#
# Nakon toga:
#   frontend        http://localhost:5173
#   API i /docs     http://localhost:8000
#   Neo4j Browser   http://localhost:7474
#
# Baza se dize prazna. Kako u nju ubaciti postojeci graf pise u README-u,
# u dijelu "Ubacivanje podataka u Docker".

services:
  neo4j:
    # VAZNO: verzija mora odgovarati onoj u Neo4j Desktopu, inace se dump
    # ne moze ucitati. Provjeri svoju u Desktopu ili u datoteci
    # packaging_info unutar mape instance.
    #
    # Enterprise, a ne Community, jer Desktop 2 svoje baze sprema u block
    # formatu koji Community ne zna otvoriti. Vidi dio "Zasto Enterprise"
    # u README-u.
    image: neo4j:2026.06.0-enterprise
    container_name: filmski-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lozinka123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # GDS se skida pri prvom pokretanju, pa tada treba internet.
      # Potreban je samo ako ponovno pokreces faze 5-7; za citanje
      # vec zapisanih vrijednosti ne treba.
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      # Graf ima oko 785 tisuca veza, pa mu treba vise memorije od zadane.
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
      # Ne pocinje s NEO4J_ da ga Neo4j ne pokusa citati kao postavku.
      CHECK_PW: ${NEO4J_PASSWORD:-lozinka123}
    volumes:
      - neo4j-data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/backups:/backups
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$CHECK_PW\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Ne dize se s `docker compose up` jer je pod profilom. Sluzi samo za
  # ucitavanje dumpa u volumen s podacima. Neo4j za to ima zasebnu sliku.
  # Verzija mora biti ista kao gore i ista kao u Desktopu.
  neo4j-admin:
    image: neo4j/neo4j-admin:2026.06.0
    profiles: ["tools"]
    volumes:
      - neo4j-data:/data
      - ./neo4j/backups:/backups
    command:
      - neo4j-admin
      - database
      - load
      - neo4j
      - --from-path=/backups
      - --overwrite-destination=true

  backend:
    build: ./backend
    container_name: filmski-backend
    ports:
      - "8000:8000"
    environment:
      # Unutar compose mreze baza se zove po imenu servisa, ne localhost.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-lozinka123}
      NEO4J_DATABASE: neo4j
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite ubacuje adresu u kod pri buildu, a preglednik radi na hostu,
        # pa ovdje ide localhost, a ne ime servisa.
        VITE_API_URL: http://localhost:8000
    container_name: filmski-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j-data:
