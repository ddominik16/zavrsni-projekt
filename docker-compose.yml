services:
  neo4j:
    image: neo4j:2026.06.0-enterprise
    container_name: filmski-neo4j
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-lozinka123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      CHECK_PW: ${NEO4J_PASSWORD:-lozinka123}
    volumes:
      - neo4j-data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/backups:/backups
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$CHECK_PW\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  neo4j-admin:
    image: neo4j/neo4j-admin:2026.06.0-enterprise
    profiles: ["tools"]
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j-data:/data
      - ./neo4j/backups:/backups
    command:
      - neo4j-admin
      - database
      - load
      - neo4j
      - --from-path=/backups
      - --overwrite-destination=true

  backend:
    build: ./backend
    container_name: filmski-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-lozinka123}
      NEO4J_DATABASE: neo4j
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: filmski-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j-data:
